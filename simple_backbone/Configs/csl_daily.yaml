data:
  src: gloss              # source: gloss sequence
  trg: skels              # target: 3D skeleton (50 joints x 3 + counter)
  files: files            # sequence names
  train: ./data/csl_daily/train
  dev: ./data/csl_daily/dev
  test: ./data/csl_daily/test
  max_sent_length: 500
  skip_frames: 1
  src_vocab: ./data/csl_daily/gloss_vocab.txt
training:
  random_seed: 27
  optimizer: adam
  learning_rate: 0.001
  learning_rate_min: 0.0002   # training stops when the LR falls below this value
  weight_decay: 0.0
  clip_grad_norm: 5.0
  batch_size: 16
  scheduling: plateau
  patience: 7
  decrease_factor: 0.7
  early_stopping_metric: dtw
  epochs: 20000
  validation_freq: 2000
  logging_freq: 250
  eval_metric: dtw
  model_dir: ./Models/simple_csl_daily
  overwrite: false
  continue: true           # resume from the latest checkpoint in model_dir if it exists
  shuffle: true
  use_cuda: true
  max_output_length: 500
  keep_last_ckpts: 1
  loss: L1
  bone_loss: MSE
  save_videos: false       # render mp4s of validation/test sequences (slow)
model:
  initializer: xavier
  bias_initializer: zeros
  embed_initializer: xavier
  trg_size: 150
  just_count_in: false
  gaussian_noise: false
  noise_rate: 5
  future_prediction: 0
  stb:
    num_frame: 500         # length of the STB temporal positional embedding
  encoder:
    type: transformer
    num_layers: 2
    num_heads: 4
    embeddings:
      embedding_dim: 512
      dropout: 0.0
    hidden_size: 512
    ff_size: 2048
    dropout: 0.0
  diffusion:
    timesteps: 1000
    sampling_timesteps: 5
    scale: 1.0
    num_layers: 2
    num_heads: 4
    hidden_size: 512
    ff_size: 2048
    dropout: 0.1
    embeddings:
      embedding_dim: 512
      dropout: 0.1
